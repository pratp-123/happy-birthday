<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Message | Happy Birthday!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-view">
  <canvas id="sakura-canvas"></canvas>
  <div id="balloon-shower" aria-hidden="true"></div>
  <main class="page-content container mx-auto p-6 md:p-12">
    <section class="page-section max-w-3xl mx-auto text-center" data-aos="fade-up">
      <p class="page-kicker">Chapter 02 / A note from the heart</p>
      <h1 class="text-4xl md:text-5xl font-anime text-sakura mb-8 drop-shadow-sm">A Special Message For You</h1>
      <div class="letter-reveal">
        <p class="letter-prompt" id="letter-prompt">Open to see a sweet message</p>
        <button class="envelope" id="envelope" type="button" aria-expanded="false" aria-controls="birthday-letter">
          <span class="envelope-back" aria-hidden="true"></span>
          <span class="envelope-letter text-left text-lg leading-relaxed space-y-4" id="birthday-letter">
            <span class="block">Dear you,</span>
            <span class="block">Wishing you a very Happy Birthday! May your wishes come true, your days stay filled with joy, and your dreams lead you to beautiful adventures ahead.</span>
            <span class="block">May your life be full of laughter, peace, love, and unforgettable memories. You are truly special, and the happiness you bring into the world is worth celebrating every single day.</span>
            <span class="block text-right mt-8">With lots of love,<br>Someone who cherishes your smile</span>
          </span>
          <span class="envelope-front" aria-hidden="true"></span>
          <span class="envelope-flap" aria-hidden="true"></span>
          <span class="envelope-seal" aria-hidden="true">♥</span>
        </button>
      </div>
    </section>
    <nav class="page-nav" aria-label="Birthday story navigation"><a href="index.html" class="page-nav-link">Previous</a><span>02 / 06</span><a href="story.html" class="page-nav-link page-nav-next">Continue</a></nav>
  </main>
  <footer class="bg-navy text-white p-8 text-center"><p>Enjoy your day to the fullest.</p><p class="text-sm opacity-70 mt-2">Hope you liked it...</p></footer>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script><script src="script.js"></script>
</body>
</html>
